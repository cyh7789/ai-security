<!doctype html>
<!-- 前端這一份沒有壞掉，也不該拿掉。它做的是把錯誤當場講給使用者聽，
     而不是等一趟往返之後才說「數量不對」。它不做的是決定資料進不進得去。 -->
<meta charset="utf-8">
<title>改數量</title>
<form id="f">
  <label>數量
    <input id="quantity" type="number" min="1" max="10" step="1" required value="2">
  </label>
  <button>送出</button>
</form>
<pre id="out"></pre>
<script>
  const out = document.getElementById("out");
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const quantity = Number(document.getElementById("quantity").value);
    const res = await fetch("/orders/1", {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ quantity }),
    });
    out.textContent = res.status + " " + (await res.text());
  });
</script>
